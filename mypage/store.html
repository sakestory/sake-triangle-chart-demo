<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>SAKE story 店用ページ</title>
<!--
  SAKE story マイページ（店側） v0.1
  © 2026 SAKE story / 橋野元樹. All rights reserved.
  このページは店専用。お客様には案内しない（URLも教えない）。
-->
<style>
  :root{
    --paper:#faf6ee; --card:#ffffff; --ink:#3b3630; --sub:#8a8177; --line:#e8e0d2;
    --indigo:#4a6b8a; --peach:#c97f6f; --gold:#9a854f;
    --accent:#7a5c3e; --accent-soft:#f3ead9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    line-height:1.7;padding:16px 10px 48px;
  }
  .wrap{max-width:430px;margin:0 auto;}
  h1{font-size:18px;text-align:center;letter-spacing:.12em;margin-bottom:2px;}
  .sub-title{text-align:center;font-size:12px;color:var(--sub);margin-bottom:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
  .card h2{font-size:15px;margin-bottom:10px;color:var(--accent);}
  .muted{color:var(--sub);font-size:12px;}
  .note{
    background:#fdf3df;border:1px solid #ecd9b0;border-radius:10px;
    font-size:12px;padding:10px 12px;margin-bottom:14px;color:#7a6a45;
  }
  input[type=password], input[type=text]{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;background:#fffdf8;margin-bottom:10px;color:var(--ink);
  }
  input:focus{outline:2px solid #d9c9a8;}
  .btn{
    border:none;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;
    background:var(--accent);color:#fff;
  }
  .btn.wide{width:100%;padding:12px;font-size:14px;}
  .btn.ghost{background:#fbf8f1;color:var(--accent);border:1px solid #d9c9a8;}
  .btn:active{opacity:.8;}
  .axis{margin:8px 0;}
  .axis .label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
  .bar{height:10px;border-radius:6px;background:#f0ebdf;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:6px;}
  .a1 i{background:var(--indigo);} .a2 i{background:var(--peach);} .a3 i{background:var(--gold);}
  .cust-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .cust-row:last-child{border-bottom:none;}
  .avatar{
    width:38px;height:38px;border-radius:50%;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:var(--accent);
  }
  .cust-main{flex:1;min-width:0;}
  .cust-name{font-size:14px;font-weight:600;overflow-wrap:anywhere;}
  .cust-sub{font-size:11px;color:var(--sub);}
  .arrow{color:var(--sub);flex-shrink:0;}
  .back-link{font-size:13px;color:var(--accent);cursor:pointer;margin-bottom:10px;display:inline-block;}
  .rank-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-num{width:22px;text-align:center;color:var(--accent);font-weight:700;flex-shrink:0;}
  .rank-name{flex:1;font-size:14px;font-weight:600;overflow-wrap:anywhere;}
  .log-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .log-row:last-child{border-bottom:none;}
  .log-date{color:var(--sub);font-size:12px;flex-shrink:0;}
  .hidden{display:none;}
  .demo-banner{
    background:#f3e7e5;border:1px solid #dcb9b3;color:#8a4a40;
    border-radius:10px;font-size:12px;padding:8px 12px;margin-bottom:12px;text-align:center;font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>SAKE story</h1>
  <div class="sub-title">店用ページ（お客様の記録）</div>

  <!-- 合言葉 -->
  <div id="viewGate">
    <div class="card">
      <h2>店の合言葉</h2>
      <p class="muted" style="margin-bottom:8px;">このページは店専用です。合言葉を入れてください。</p>
      <input type="password" id="inKey" placeholder="合言葉">
      <button class="btn wide" onclick="enter()">ひらく</button>
      <p class="muted" id="gateMsg" style="margin-top:8px;"></p>
    </div>
  </div>

  <!-- 一覧 -->
  <div id="viewHome" class="hidden">
    <div id="demoBanner" class="demo-banner hidden">見本データを表示中（クラウド接続前の動作確認用）</div>
    <div class="card">
      <h2>お客様一覧</h2>
      <p class="muted" style="margin-bottom:4px;">名前を押すと、その方の記録が見られます。</p>
      <div id="custList"></div>
    </div>
    <div class="card">
      <h2>今月よく出ている銘柄</h2>
      <div id="rankList"></div>
    </div>
    <button class="btn wide ghost" onclick="loadData(true)">最新の情報に更新</button>
    <p class="muted" id="loadMsg" style="text-align:center;margin-top:6px;"></p>
  </div>

  <!-- お客様詳細 -->
  <div id="viewDetail" class="hidden">
    <span class="back-link" onclick="closeCust()">← お客様一覧にもどる</span>
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div class="avatar" id="dAvatar"></div>
        <div>
          <div class="cust-name" id="dName"></div>
          <div class="cust-sub" id="dType"></div>
        </div>
      </div>
      <p class="muted" style="margin-bottom:2px;">直近の診断結果</p>
      <div id="dAxes"></div>
    </div>
    <div class="card">
      <h2>この方の飲んだ記録</h2>
      <div id="dLog"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* gasUrl：お客様側 index.html と同じGASのURLを貼る。空のあいだは見本データで動く。 */
var CONFIG = { gasUrl: "https://script.google.com/macros/s/AKfycbyvvk4ijDFZVNgSfCNsWVGt5V0KBvH1rPO0AmwCjZxCB9f1BgwAzzlUmdMrSQKE-uX9Zw/exec" };

/* 見本の日付は「今日から◯日前」で作る（いつ見てもランキングが動くように） */
function daysAgo(n){
  var d = new Date(); d.setDate(d.getDate()-n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
var DEMO = {
  customers: [
    {id:"M-DEMO01", nick:"（見本）さけ太郎", type:"甘い顔、潔い後味", x:5, y:8, z:3,
     drinks:[{d:daysAgo(0),n:"新政"},{d:daysAgo(0),n:"鍋島"},{d:daysAgo(9),n:"天賦"}]},
    {id:"M-DEMO02", nick:"（見本）ゆき", type:"はずむソーダ水", x:8, y:7, z:2,
     drinks:[{d:daysAgo(2),n:"磐城壽夏酒"},{d:daysAgo(2),n:"弥右衛門"}]},
    {id:"M-DEMO03", nick:"（見本）けんじ", type:"旨味ひとすじ", x:3, y:2, z:9,
     drinks:[{d:daysAgo(1),n:"残響"},{d:daysAgo(1),n:"木曽路"},{d:daysAgo(6),n:"十四代"},{d:daysAgo(12),n:"残響"}]}
  ]
};
var customersData = [];

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtDate(iso){
  if(!iso) return "-";
  var p = String(iso).split("-");
  return p.length===3 ? (Number(p[1])+"/"+Number(p[2])) : iso;
}
function show(id,on){ document.getElementById(id).classList.toggle("hidden",!on); }

function enter(){
  var key = document.getElementById("inKey").value.trim();
  if(!key){ document.getElementById("gateMsg").textContent = "合言葉を入れてください"; return; }
  sessionStorage.setItem("sakestory_store_key", key);
  loadData(false);
}
function loadData(isRefresh){
  var key = sessionStorage.getItem("sakestory_store_key") || "";
  if(!CONFIG.gasUrl){
    /* クラウド未接続：見本で動作確認（合言葉は「miho」） */
    if(key !== "miho"){
      document.getElementById("gateMsg").textContent = "合言葉が違います（クラウド接続前の見本の合言葉は miho です）";
      return;
    }
    customersData = DEMO.customers;
    show("demoBanner", true);
    openHome();
    return;
  }
  document.getElementById(isRefresh ? "loadMsg" : "gateMsg").textContent = "読み込んでいます…";
  fetch(CONFIG.gasUrl + "?action=list&key=" + encodeURIComponent(key))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok){
        sessionStorage.removeItem("sakestory_store_key");
        document.getElementById("gateMsg").textContent = "合言葉が違います";
        show("viewHome", false); show("viewGate", true);
        return;
      }
      customersData = j.customers || [];
      show("demoBanner", false);
      openHome();
      document.getElementById("loadMsg").textContent = "更新しました（" + new Date().toLocaleTimeString() + "）";
    })
    .catch(function(){
      document.getElementById(isRefresh ? "loadMsg" : "gateMsg").textContent = "通信できませんでした。もう一度お試しください。";
    });
}
function openHome(){
  show("viewGate", false); show("viewDetail", false); show("viewHome", true);
  renderList(); renderRank();
}
function renderList(){
  var html = "";
  var sorted = customersData.slice().sort(function(a,b){
    var la = a.drinks.length ? a.drinks[0].d : "";
    var lb = b.drinks.length ? b.drinks[0].d : "";
    return la<lb ? 1 : -1;
  });
  sorted.forEach(function(c,i){
    var last = c.drinks.length ? fmtDate(c.drinks[0].d) : "-";
    html += '<div class="cust-row" onclick="openCust('+i+')">'
      + '<div class="avatar">'+esc(c.nick.charAt(0))+'</div>'
      + '<div class="cust-main"><div class="cust-name">'+esc(c.nick)+' さん</div>'
      + '<div class="cust-sub">'+esc(c.type||"診断なし")+' ・ 記録'+c.drinks.length+'杯 ・ 最終 '+last+'</div></div>'
      + '<div class="arrow">›</div></div>';
  });
  window._sorted = sorted;
  document.getElementById("custList").innerHTML = html || '<p class="muted">まだ登録がありません。</p>';
}
function renderRank(){
  var now = new Date();
  var ym = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  var count = {};
  customersData.forEach(function(c){
    c.drinks.forEach(function(d){
      if(String(d.d).indexOf(ym)===0) count[d.n] = (count[d.n]||0)+1;
    });
  });
  var rank = Object.keys(count).map(function(k){ return [k,count[k]]; })
    .sort(function(a,b){ return b[1]-a[1]; }).slice(0,10);
  var html = "";
  rank.forEach(function(r,i){
    html += '<div class="rank-row"><div class="rank-num">'+(i+1)+'</div>'
      + '<div class="rank-name">'+esc(r[0])+'</div>'
      + '<div class="muted">'+r[1]+'杯</div></div>';
  });
  document.getElementById("rankList").innerHTML = html || '<p class="muted">今月の記録はまだありません。</p>';
}
function openCust(i){
  var c = window._sorted[i];
  if(!c) return;
  show("viewHome", false); show("viewDetail", true);
  document.getElementById("dAvatar").textContent = c.nick.charAt(0);
  document.getElementById("dName").textContent = c.nick + " さん";
  document.getElementById("dType").textContent = "診断タイプ：" + (c.type || "診断なし");
  var ax = "";
  if(c.type){
    var rows = [["すっきり","a1",c.x],["フルーティ","a2",c.y],["しっかり","a3",c.z]];
    rows.forEach(function(r){
      ax += '<div class="axis '+r[1]+'"><div class="label"><span>'+r[0]+'</span><span>'+r[2]+'</span></div>'
        + '<div class="bar"><i style="width:'+(r[2]*10)+'%"></i></div></div>';
    });
  } else {
    ax = '<p class="muted">診断結果はまだありません。</p>';
  }
  document.getElementById("dAxes").innerHTML = ax;
  var html = "";
  c.drinks.forEach(function(d){
    html += '<div class="log-row"><span>'+esc(d.n)+'</span><span class="log-date">'+fmtDate(d.d)+'</span></div>';
  });
  document.getElementById("dLog").innerHTML = html || '<p class="muted">まだ記録がありません。</p>';
}
function closeCust(){ show("viewDetail", false); show("viewHome", true); }

/* 起動：合言葉が残っていればそのまま読み込み */
if(sessionStorage.getItem("sakestory_store_key")) loadData(false);
</script>
</body>
</html>
