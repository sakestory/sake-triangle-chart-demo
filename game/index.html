.sk-root{
  --washi:#F7F4EC;
  --washi-deep:#EDE7DA;
  --sumi:#2B2A26;
  --sumi-soft:#5C594F;
  --ai:#22505F;
  --ai-light:#3E7488;
  --kouji:#B98F2B;
  --tsuchi:#8C5A3C;
  --line:#DAD2C0;
  background:var(--washi);
  color:var(--sumi);
  min-height:100vh;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 52px;
}
.sk-wrap{max-width:640px;margin:0 auto;padding:0 20px;box-sizing:border-box;}
.sk-mincho{font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"MS PMincho",serif;}

.sk-bar{padding:18px 0 12px;}
.sk-bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px;}
.sk-step-no{font-size:12px;letter-spacing:.14em;color:var(--sumi-soft);}
.sk-step-name{font-size:13px;color:var(--ai);font-weight:600;}
.sk-track{height:3px;background:var(--washi-deep);border-radius:2px;overflow:hidden;}
.sk-fill{height:100%;background:var(--ai);transition:width .5s ease;}

.sk-card{
  background:#FFFDF8;
  border:1px solid var(--line);
  border-radius:3px;
  padding:0 0 26px;
  margin-top:18px;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
  overflow:hidden;
}
.sk-inner{padding:0 22px;}
.sk-illust{
  display:block;width:100%;height:auto;
  background:var(--washi-deep);
  border-bottom:1px solid var(--line);
}
.sk-cat-art{
  aspect-ratio:16/9;object-fit:cover;object-position:center;
}
/* 2026-07-29：結果画面の酒猫だけは正方形（640×640）。
   工程用の写真（800×450＝16:9）と同じ 16/9＋cover をかけると上下が切れていたため、
   専用クラスで正方形のまま全体を出す。橋野さん指摘。 */
.sk-cat-result{
  aspect-ratio:1/1;object-fit:contain;object-position:center;
  width:min(100%,300px);margin:0 auto;
  background:var(--washi-deep);border-bottom:none;
  padding:12px 0 0;
}
.sk-eyebrow{
  font-size:11px;letter-spacing:.2em;color:var(--kouji);
  margin:22px 0 12px;font-weight:700;
}
.sk-h{
  font-size:25px;line-height:1.5;margin:0 0 16px;font-weight:600;
  letter-spacing:.02em;word-break:break-word;
}
.sk-lede{font-size:15px;line-height:2.05;color:var(--sumi-soft);margin:0 0 15px;word-break:break-word;}
.sk-lede:last-of-type{margin-bottom:0;}

.sk-opts{display:flex;flex-direction:column;gap:11px;margin-top:22px;}
.sk-opt{
  text-align:left;width:100%;box-sizing:border-box;
  background:var(--washi);border:1px solid var(--line);
  border-radius:3px;padding:15px 16px;cursor:pointer;
  font-family:inherit;color:var(--sumi);
  transition:border-color .18s ease, background .18s ease, transform .18s ease;
}
.sk-opt:hover{border-color:var(--ai-light);background:#FFFDF8;}
.sk-opt:focus-visible{outline:2px solid var(--ai);outline-offset:2px;}
.sk-opt:active{transform:translateY(1px);}
.sk-opt-t{display:block;font-size:16px;font-weight:600;line-height:1.6;margin-bottom:4px;word-break:break-word;}
.sk-opt-s{display:block;font-size:13px;line-height:1.8;color:var(--sumi-soft);word-break:break-word;}

.sk-note{
  margin-top:20px;padding:16px 17px;
  background:var(--washi-deep);border-radius:3px;
  font-size:13.5px;line-height:2.05;color:var(--sumi-soft);word-break:break-word;
}
.sk-note-label{display:block;margin:0 0 8px;color:var(--ai);font-size:11px;font-weight:700;letter-spacing:.12em;line-height:1.5;}
.sk-note b{color:var(--ai);font-weight:600;}
.sk-note p{margin:0 0 11px;}
.sk-note p:last-child{margin:0;}

/* ── 作業中の演出（v0.10.0：Codex納品の「動く部品」を個別に動かす） ──
   絵を丸ごと動かすのをやめ、SVGの中の sk-part-* が付いた部品だけを動かす。
   静止時（通常の工程画面）は一切動かさず、作業中パネルの中だけで動く。 */
.sk-work{cursor:pointer;user-select:none;}
.sk-work-art{position:relative;overflow:hidden;}
.sk-work-art svg,.sk-work-art img{display:block;width:100%;}

@keyframes skSpin{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes skSteam{0%{transform:translateY(4px) scale(.9);opacity:.15}45%{opacity:.5}100%{transform:translateY(-16px) scale(1.25);opacity:0}}
@keyframes skPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.9}}
@keyframes skBubble{0%{transform:translateY(3px);opacity:.35}50%{transform:translateY(-6px);opacity:.85}100%{transform:translateY(3px);opacity:.35}}
@keyframes skDrip{0%{transform:translateY(-6px);opacity:0}30%{opacity:.85}100%{transform:translateY(12px);opacity:0}}
@keyframes skSway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes skFade{0%,100%{opacity:1}50%{opacity:.72}}

/* 動くのは作業中パネルの中だけ。通常の工程画面では止まったまま */
.sk-work-art .sk-part-spin{animation:skSpin 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%;}
.sk-work-art .sk-part-steam{animation:skSteam 1.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
.sk-work-art .sk-part-pulse{animation:skPulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%;}
.sk-work-art .sk-part-bubble{animation:skBubble 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
.sk-work-art .sk-part-drip{animation:skDrip 1.3s ease-in infinite;transform-box:fill-box;transform-origin:50% 0%;}
.sk-work-art .sk-part-sway{animation:skSway 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
.sk-work-art .sk-part-fade{animation:skFade 2s ease-in-out infinite;}

.sk-work-t{margin:0 0 10px;font-size:20px;font-weight:700;color:var(--ai);letter-spacing:.03em;}
.sk-work-dots i{opacity:0;animation:skDot 1.2s infinite;}
.sk-work-dots i:nth-child(2){animation-delay:.2s;}
.sk-work-dots i:nth-child(3){animation-delay:.4s;}
@keyframes skDot{0%,60%,100%{opacity:0}30%{opacity:1}}
.sk-work-move{margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px;}
.sk-work-ax{font-size:12.5px;padding:4px 11px;border-radius:999px;background:var(--washi-deep);
  color:var(--sumi-soft);animation:skPop .5s ease-out both;animation-delay:.35s;}
.sk-work-ax b{font-weight:700;}
.sk-ax-s b{color:#6E8FA3;} .sk-ax-f b{color:#C46B7E;} .sk-ax-k b{color:#C0893C;}
@keyframes skPop{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.sk-work-bar{height:3px;border-radius:2px;background:var(--washi-deep);overflow:hidden;}
.sk-work-bar span{display:block;height:100%;background:var(--ai);width:0;animation:skFill 1.6s linear forwards;}
@keyframes skFill{to{width:100%}}
.sk-work-skip{margin:10px 0 0;font-size:11.5px;color:var(--sumi-soft);opacity:.75;text-align:right;}

/* 結果画面：名前の由来 */
.sk-name-why{margin:6px 0 0;font-size:13px;line-height:1.9;color:var(--sumi-soft);}

@media (prefers-reduced-motion: reduce){
  .sk-work-art [class*="sk-part-"],.sk-work-dots i,.sk-work-ax{animation:none!important;}
  .sk-work-bar span{animation:none!important;width:100%;}
}

/* ── 酒猫の色味4種（2026-07-30）。画像は1枚のまま、色だけ変える ── */
.sk-tone-ai{filter:none;}
.sk-tone-kohaku{filter:sepia(1) saturate(2.8) hue-rotate(-14deg) brightness(1.08) contrast(1.02);}
.sk-tone-sumi{filter:grayscale(1) brightness(.92) contrast(1.12);}
.sk-tone-shakudo{filter:sepia(1) saturate(3.4) hue-rotate(-32deg) brightness(.86) contrast(1.06);}
.sk-tone-label{
  display:inline-block;margin:0 0 0 8px;padding:2px 9px;border-radius:999px;
  font-size:11px;letter-spacing:.08em;vertical-align:middle;
  background:var(--washi-deep);color:var(--sumi-soft);
}

/* ── v0.10.0：分類を主役にした結果表示 ── */
.sk-fuda{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;}
.sk-fuda-i{font-size:13px;padding:5px 13px;border-radius:999px;
  background:var(--washi-deep);color:var(--sumi-soft);letter-spacing:.04em;}
.sk-sub-name{margin:14px 0 0;font-size:14px;color:var(--sumi-soft);}
.sk-sub-yomi{margin-left:8px;font-size:12px;opacity:.75;}
.sk-use-mai{margin:4px 0 0;font-size:13px;color:var(--sumi-soft);}
.sk-kubun-note{margin:8px 0 16px;font-size:11.5px;color:var(--sumi-soft);opacity:.8;}
.sk-meishou-hint{margin:10px 0 0;font-size:13px;line-height:1.9;color:var(--ai);}
.sk-meishou-note{margin:10px 0 0;font-size:11.5px;line-height:1.85;color:var(--sumi-soft);opacity:.85;}
/* 小ネタの折りたたみ */
.sk-note-fold{cursor:pointer;}
.sk-note-fold>summary{list-style:none;cursor:pointer;}
.sk-note-fold>summary::-webkit-details-marker{display:none;}
.sk-note-fold>summary::after{content:"";}
.sk-note-fold[open]>summary{margin-bottom:10px;}

/* 結果画面：名前の由来（2026-07-29） */
.sk-name-why{margin:6px 0 0;font-size:13px;line-height:1.9;color:var(--sumi-soft);}

@media (prefers-reduced-motion: reduce){
  .sk-work-art [class*="sk-part-"],.sk-work-dots i,.sk-work-ax{animation:none!important;}
  .sk-work-bar span{animation:none!important;width:100%;}
}

/* 2026-07-29：結果画面に出す「特定名称」の枠 */
.sk-meishou{
  margin-top:20px;padding:16px 17px;
  background:var(--washi-deep);border-radius:3px;
  border:1px solid rgba(31,58,95,.16);
  word-break:break-word;
}
.sk-meishou-lb{display:block;margin:0 0 6px;color:var(--ai);font-size:11px;font-weight:700;letter-spacing:.12em;line-height:1.5;}
.sk-meishou-n{
  margin:0 0 7px;color:var(--ai);
  font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"MS PMincho",serif;
  font-size:23px;font-weight:700;line-height:1.45;letter-spacing:.04em;
}
.sk-meishou-why{margin:0;font-size:13px;line-height:1.95;color:var(--sumi-soft);}

.sk-skip{
  display:block;margin:16px auto 0;background:none;border:none;
  color:var(--sumi-soft);font-size:13px;font-family:inherit;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;
}
.sk-skip:hover{color:var(--ai);}

.sk-next{
  display:block;width:100%;box-sizing:border-box;margin-top:22px;
  background:var(--ai);color:#FFFDF8;border:none;border-radius:3px;
  padding:16px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:background .18s ease;
}
.sk-next:hover{background:var(--ai-light);}
.sk-link-btn{text-decoration:none;text-align:center;}
.sk-share-canvas{
  display:block;width:100%;height:auto;border:1px solid var(--line);
  border-radius:4px;margin-top:6px;box-shadow:0 6px 20px -10px rgba(43,42,38,.3);
}
.sk-share-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.sk-share-btns .sk-next{margin-top:0;font-size:14px;padding:14px 8px;}
.sk-ghost{background:transparent;color:var(--ai);border:1px solid var(--ai);}
.sk-ghost:hover{background:var(--washi-deep);}
.sk-share-hint{font-size:12px;color:var(--sumi-soft);text-align:center;margin:11px 2px 0;line-height:1.8;}
.sk-yomi{font-size:13px;letter-spacing:.22em;color:var(--kouji);margin:6px 0 0;}
.sk-ver{display:inline-block;margin-top:5px;color:var(--kouji);letter-spacing:.04em;}
.sk-line-btn{
  display:block;width:100%;box-sizing:border-box;margin-top:13px;
  background:#06C755;color:#FFFFFF;text-align:center;text-decoration:none;
  border-radius:4px;padding:14px 10px;font-size:15px;font-weight:700;letter-spacing:.02em;
}
.sk-line-btn:hover{background:#05B34C;}
.sk-line-btn:focus-visible{outline:2px solid var(--kouji);outline-offset:2px;}
.sk-sns{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:11px !important;}
.sk-sns a{color:var(--ai);font-weight:600;text-decoration:underline;text-underline-offset:3px;}
@media (max-width:360px){.sk-share-btns{grid-template-columns:1fr;}}
.sk-total{
  font-size:13px;line-height:1.9;color:var(--sumi-soft);
  margin:0 0 14px;display:flex;flex-direction:column;gap:2px;
}
.sk-total strong{color:var(--ai);font-weight:700;}
.sk-total-note{font-size:11.5px;color:#8A8071;}
.sk-next:focus-visible{outline:2px solid var(--kouji);outline-offset:2px;}

.sk-gauge{
  position:relative;height:46px;background:var(--washi-deep);
  border-radius:3px;margin-top:20px;overflow:hidden;
}
.sk-zone{position:absolute;top:0;bottom:0;background:rgba(34,80,95,.16);}
.sk-zone-core{position:absolute;top:0;bottom:0;background:rgba(185,143,43,.3);}
.sk-needle{position:absolute;top:0;bottom:0;width:2px;background:var(--sumi);}
.sk-gauge-cap{font-size:12.5px;color:var(--sumi-soft);margin-top:10px;line-height:1.9;}

.sk-chart{display:block;width:100%;height:auto;margin:6px auto 0;max-width:340px;}
.sk-axis-list{display:flex;flex-direction:column;gap:9px;margin-top:20px;}
.sk-axis-row{display:flex;align-items:center;gap:11px;}
.sk-axis-lb{font-size:13px;width:74px;flex-shrink:0;color:var(--sumi-soft);}
.sk-axis-track{display:block;flex:1;height:7px;background:var(--washi-deep);border-radius:4px;overflow:hidden;}
/* span のままだと幅も高さも効かず、色の帯が出ない（2026-07-27修正） */
.sk-axis-fill{display:block;height:100%;border-radius:4px;transition:width .6s ease;}
/* 2026-07-27：三軸の数値表示は取りやめ（橋野さん指示）。帯の長さだけで傾きを伝える */

.sk-log{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;}
.sk-log-h{font-size:12px;letter-spacing:.16em;color:var(--kouji);font-weight:700;margin:0 0 12px;}
.sk-log-row{display:flex;gap:10px;font-size:13px;line-height:1.9;padding:5px 0;color:var(--sumi-soft);}
.sk-log-k{width:94px;flex-shrink:0;color:var(--sumi);}
.sk-log-v{flex:1;word-break:break-word;}

.sk-brand{
  border:1px solid var(--line);border-radius:3px;
  padding:16px 17px;margin-top:12px;background:var(--washi);
}
.sk-brand-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:7px;}
.sk-brand-rank{
  font-size:11px;letter-spacing:.1em;color:#FFFDF8;background:var(--ai);
  border-radius:2px;padding:3px 7px;flex-shrink:0;font-weight:700;
}
.sk-brand-n{font-size:18px;font-weight:600;line-height:1.5;word-break:break-word;}
.sk-brand-m{font-size:12.5px;color:var(--sumi-soft);word-break:break-word;}
.sk-brand-mk{font-size:15px;color:var(--kouji);flex-shrink:0;}
.sk-brand-st{
  font-size:11px;color:#FFFDF8;background:var(--ai);border-radius:2px;
  padding:3px 7px;letter-spacing:.04em;flex-shrink:0;
}
.sk-brand-legend{font-size:11.5px;line-height:1.85;color:var(--sumi-soft);margin:14px 2px 0;}

.sk-caution{
  margin-top:18px;padding:14px 15px;border-radius:3px;
  border:1px dashed var(--tsuchi);
  font-size:12.5px;line-height:1.95;color:var(--tsuchi);word-break:break-word;
}
.sk-name{
  font-size:29px;line-height:1.5;margin:4px 0 14px;font-weight:600;
  color:var(--ai);word-break:break-word;
}
.sk-foot{
  text-align:center;font-size:12px;color:var(--sumi-soft);
  margin-top:26px;line-height:1.95;
}
.sk-mini{
  margin-top:16px;border:1px solid var(--line);border-radius:3px;
  background:var(--washi);padding:15px 16px 14px;
}
.sk-mini-h{
  font-size:11.5px;letter-spacing:.16em;color:var(--kouji);
  font-weight:700;margin:0 0 4px;
}
.sk-mini-lede{font-size:13px;line-height:1.9;color:var(--sumi-soft);margin:0 0 8px;}
.sk-mini-row{
  display:flex;gap:10px;font-size:13px;line-height:1.85;
  padding:7px 0;border-top:1px solid var(--line);
}
.sk-mini-k{width:88px;flex-shrink:0;color:var(--ai);font-weight:600;word-break:break-word;}
.sk-mini-v{flex:1;color:var(--sumi-soft);word-break:break-word;}
.sk-mini-f{
  font-size:12.5px;line-height:1.9;color:var(--sumi-soft);
  margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line);word-break:break-word;
}
.sk-gacha-card{position:relative;isolation:isolate;}
.sk-gacha-stage{
  position:relative;min-height:460px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:32px 22px;
  overflow:hidden;background:#FFFDF8;
}
.sk-gacha-rays{
  position:absolute;inset:-35%;z-index:-2;opacity:.28;
  background:repeating-conic-gradient(from 0deg,#F8EFD5 0 9deg,#FFFDF8 9deg 18deg);
  animation:sk-rays 12s linear infinite;transition:opacity .5s ease;
}
.sk-gacha-ring{
  position:absolute;width:230px;height:230px;border:1px solid rgba(185,143,43,.55);
  border-radius:50%;z-index:-1;box-shadow:0 0 0 18px rgba(185,143,43,.08),0 0 0 44px rgba(34,80,95,.05);
  animation:sk-ring 1.8s ease-in-out infinite alternate;transition:transform .5s ease,opacity .5s ease;
}

/* ── 米粒と麹の光。中央へ集まる ── */
.sk-grains{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;}
.sk-grains i{
  position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;
  background:var(--kouji);opacity:0;
  transform:rotate(calc(var(--n)*30deg)) translateY(-190px);
}
.sk-ph-gather .sk-grains{opacity:1;}
.sk-ph-gather .sk-grains i{animation:sk-gather .9s cubic-bezier(.4,0,.3,1) both;animation-delay:calc(var(--n)*30ms);}
@keyframes sk-gather{
  0%{opacity:0;transform:rotate(calc(var(--n)*30deg)) translateY(-190px) scale(.6)}
  25%{opacity:.9}
  100%{opacity:0;transform:rotate(calc(var(--n)*30deg)) translateY(-14px) scale(.3)}
}

/* ── 閉じた仕込み桶 ── */
.sk-oke{position:relative;width:190px;height:150px;margin-bottom:6px;transition:opacity .35s ease;}
.sk-oke-body{
  position:absolute;left:14px;bottom:0;width:162px;height:104px;
  background:var(--washi-deep);border:2px solid var(--ai);border-radius:6px 6px 16px 16px;
}
.sk-oke-lid{
  position:absolute;left:0;top:26px;width:190px;height:26px;
  background:#FFFDF8;border:2px solid var(--ai);border-radius:6px;
  transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.4,.5,1);
}
.sk-oke-glow{
  position:absolute;left:50%;top:44px;width:6px;height:6px;margin-left:-3px;border-radius:50%;
  background:var(--kouji);opacity:0;box-shadow:0 0 24px 12px rgba(185,143,43,.55);
}
.sk-ph-gather .sk-oke-glow{animation:sk-glow .9s ease-in both;}
@keyframes sk-glow{0%{opacity:0}100%{opacity:.95}}
/* 猫の影が一瞬 */
.sk-ph-hint .sk-oke-lid{transform:translateY(-10px) rotate(-6deg);}
.sk-ph-hint .sk-oke-glow{opacity:1;animation:sk-blink .45s steps(2,end) 2;}
@keyframes sk-blink{50%{opacity:.35}}
/* 光がはじける */
.sk-ph-burst .sk-oke-lid{transform:translateY(-120px) rotate(-26deg);opacity:0;}
.sk-ph-burst .sk-oke-glow{animation:sk-burst .5s cubic-bezier(.2,.8,.3,1) both;}
@keyframes sk-burst{0%{opacity:1;box-shadow:0 0 24px 12px rgba(185,143,43,.55)}
  100%{opacity:0;box-shadow:0 0 0 260px rgba(255,253,248,.95)}}
.sk-ph-burst .sk-gacha-ring{transform:scale(1.5);opacity:0;}
.sk-ph-reveal .sk-oke,.sk-ph-burst .sk-oke{opacity:0;position:absolute;}
.sk-ph-reveal .sk-gacha-rays{opacity:.5;}

/* ── ピカー！（burst のときだけ光る） ── */
.sk-flash{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(circle at 50% 46%,#fff 0%,#FFF6DF 38%,rgba(255,253,248,0) 72%);
  opacity:0;
}
.sk-ph-burst .sk-flash{animation:sk-flash .5s cubic-bezier(.15,.9,.3,1) both;}
@keyframes sk-flash{
  0%{opacity:0;transform:scale(.2)}
  18%{opacity:1;transform:scale(1.15)}
  55%{opacity:.85}
  100%{opacity:0;transform:scale(1.6)}
}
.sk-beams{position:absolute;left:50%;top:46%;z-index:2;pointer-events:none;opacity:0;}
.sk-beams i{
  position:absolute;left:0;top:0;width:5px;height:230px;margin-left:-2.5px;
  background:linear-gradient(to top,rgba(185,143,43,0) 0%,rgba(255,241,203,.95) 45%,rgba(185,143,43,0) 100%);
  transform-origin:50% 0;transform:rotate(calc(var(--b)*36deg)) scaleY(0);
}
.sk-ph-burst .sk-beams{opacity:1;}
.sk-ph-burst .sk-beams i{animation:sk-beam .5s cubic-bezier(.1,.9,.3,1) both;animation-delay:calc(var(--b)*12ms);}
@keyframes sk-beam{
  0%{transform:rotate(calc(var(--b)*36deg)) scaleY(0);opacity:0}
  35%{opacity:1}
  100%{transform:rotate(calc(var(--b)*36deg)) scaleY(1.5);opacity:0}
}
/* 猫が出たあとの、ちいさなきらめき */
.sk-sparks{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;}
.sk-sparks i{
  position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;
  background:radial-gradient(circle,#fff 0 30%,rgba(255,241,203,.9) 45%,rgba(255,241,203,0) 70%);
  transform:rotate(calc(var(--k)*45deg)) translateY(-118px) scale(0);
}
.sk-ph-reveal .sk-sparks{opacity:1;}
.sk-ph-reveal .sk-sparks i{animation:sk-spark 1.05s ease-out both;animation-delay:calc(.15s + var(--k)*70ms);}
@keyframes sk-spark{
  0%{transform:rotate(calc(var(--k)*45deg)) translateY(-92px) scale(0);opacity:0}
  40%{opacity:1;transform:rotate(calc(var(--k)*45deg)) translateY(-130px) scale(1.15)}
  100%{opacity:0;transform:rotate(calc(var(--k)*45deg)) translateY(-152px) scale(.4)}
}

/* ── 猫 ── */
.sk-gacha-img{
  display:block;width:min(100%,420px);aspect-ratio:16/9;object-fit:cover;
  border:1px solid var(--line);border-radius:4px;background:var(--washi-deep);
  box-shadow:0 14px 34px rgba(43,42,38,.13);transform-origin:50% 65%;
  opacity:0;position:absolute;pointer-events:none;
}
.sk-ph-reveal .sk-gacha-img{
  opacity:1;position:static;animation:sk-reveal 1.05s cubic-bezier(.2,.78,.24,1) both;
}
.sk-brewed-stamp{
  display:inline-block;margin:14px 0 0;padding:5px 11px;border:1px solid var(--kouji);
  color:var(--kouji);font-size:11px;letter-spacing:.18em;font-weight:700;
  opacity:0;transform:translateY(6px);
}
.sk-ph-reveal .sk-brewed-stamp{animation:sk-pop-in .45s ease-out .35s both;}
@keyframes sk-pop-in{to{opacity:1;transform:none}}
.sk-gacha-title{font-size:28px;line-height:1.5;margin:16px 0 8px;color:var(--ai);min-height:1.5em;}
.sk-gacha-copy{font-size:14px;line-height:1.9;color:var(--sumi-soft);margin:0;max-width:420px;min-height:1.9em;}
.sk-gacha-stage .sk-next{max-width:420px;}
.sk-gacha-skip{margin-top:10px;}

@keyframes sk-rays{to{transform:rotate(360deg)}}
@keyframes sk-ring{to{transform:scale(1.08);opacity:.62}}
@keyframes sk-reveal{
  0%{transform:scale(.72) rotate(-2deg);filter:brightness(.7);opacity:.35}
  55%{transform:scale(1.055) rotate(1deg);filter:brightness(1.16);opacity:1}
  100%{transform:scale(1) rotate(0);filter:brightness(1);opacity:1}
}
@media (max-width:400px){
  .sk-h{font-size:22px;}
  .sk-name{font-size:25px;}
  .sk-inner{padding:0 17px;}
  .sk-mini{padding:14px 13px 13px;}
  .sk-mini-k{width:78px;}
  .sk-gacha-stage{min-height:420px;padding:27px 17px;}
  .sk-gacha-title{font-size:24px;}
}
@media (prefers-reduced-motion:reduce){
  .sk-fill,.sk-axis-fill,.sk-opt{transition:none;}
  .sk-gacha-rays,.sk-gacha-ring,.sk-gacha-img,.sk-grains i,.sk-oke-glow,.sk-brewed-stamp,
  .sk-flash,.sk-beams i,.sk-sparks i{animation:none!important;}
  .sk-oke-lid{transition:none;}
  .sk-brewed-stamp{opacity:1;transform:none;}
}

n(e,"火入れ"),l=[];(e||[]).some(a=>a.k==="仕上げ"&&a.v.indexOf("無濾過")>=0)&&l.push("無濾過"),r==="生酒"&&l.push("生"),(e||[]).some(a=>a.k==="仕上げ"&&a.v.indexOf("原酒")>=0)&&l.push("原酒"),l.length&&t.push(l.length===1&&l[0]==="生"?"生酒":l.join(""));const i=dn(e,"貯蔵・熟成"),s=(zc[r]||{})[i]||"";return s&&t.push(s),t.slice(0,3)}function ii(e){return dn(e,"米づくり")||"蔵におまかせ"}const Mc=e=>{const t=f=>{const g=(e||[]).find(k=>k.k===f);return g?g.v:""},n=/(\d+)％/.exec(t("精米"));if(!n)return null;const r=Number(n[1]),l=t("アルコール添加").indexOf("米と米麹だけ")>=0,i=t("醪（もろみ）管理").indexOf("低温")>=0,s=l?"米と米麹だけで仕込んだ":"醸造アルコールで香味を調えた";let a,u,p="";return r<=50&&i?(a=l?"純米大吟醸":"大吟醸",u=`精米歩合${r}％まで磨き、${s}お酒です。醪を低温でゆっくり発酵させました。`):r<=60&&i?(a=l?"純米吟醸":"吟醸",u=`精米歩合${r}％（60％以下）で、${s}お酒です。醪を低温でゆっくり発酵させました。`):l?(a="純米",u=`${r}％まで磨き、米と米麹だけで仕込んだお酒です。`,r<=60&&(u+="今回は醪管理で「低温で、ゆっくり」を選ばなかったため、ゲーム上では吟醸の枠には入りません。",p=`醪を低温でゆっくり発酵させると、${r<=50?"純米大吟醸酒":"純米吟醸酒"}になります。`)):r<=70?(a="本醸造",u=`精米歩合${r}％（70％以下）で、醸造アルコールで香味を調えたお酒です。`,r<=60&&(u+="今回は醪管理で「低温で、ゆっくり」を選ばなかったため、ゲーム上では吟醸の枠には入りません。",p=`醪を低温でゆっくり発酵させると、${r<=50?"大吟醸酒":"吟醸酒"}になります。`)):(a="普通酒",u=`精米歩合${r}％で醸造アルコールを使ったため、特定名称の枠には入りません。日常の食卓でいちばん飲まれてきた、暮らしの酒です。`),{name:a,why:u,hint:p,junmai:l,rate:r}},Ne=[{id:"rice",label:"米づくり",eyebrow:"田んぼ",art:pe.rice,catArt:Yt.rice,optional:!0,title:"どんな米を育てますか",lede:["酒になる米は、ふだん食べる米とは別のものです。粒が大きく、中心に「心白（しんぱく）」と呼ばれる白く濁った芯を持つものが向いています。","心白の正体は、デンプンの粒がすき間だらけに並んだ部分です。ここに麹菌が菌糸を伸ばしていく。だから酒米は「食べておいしいか」ではなく「溶けやすいか」で選ばれてきました。実際、酒米をそのまま炊いて食べても、あまりおいしくありません。"],note:"<p>酒米は「食べておいしい米」よりも、<b>麹を育てやすく、醪で溶けやすい米</b>として選ばれます。大粒で心白を持つものが多いのは、そのためです。</p><p>酒米は食用米と同じ「米」でも、得意な仕事が違います。</p>",options:[{t:"山田錦",s:"香味のバランスがよく、まろやかに広がる方向へ",d:{s:1,f:2,k:2},log:"山田錦"},{t:"五百万石",s:"硬めで溶けすぎにくい。すっきりとキレる味わいに",d:{s:4,f:1,k:0},log:"五百万石"},{t:"雄町",s:"よく溶けて、ふくよかな旨味とジューシーな広がりが出る",d:{s:0,f:3,k:4},log:"雄町"}]},{id:"seimai",label:"精米",eyebrow:"精米所",art:pe.seimai,catArt:Yt.seimai,title:"米をどこまで磨きますか",lede:["米の外側には、たんぱく質や脂質が多く含まれます。これらは酒になると雑味のもとになり、香りの立ち方も鈍らせます。だから外側を削り落とします。削ったあとに残った割合が「精米歩合」です。","50％なら、半分を削って半分だけを使うということ。精米機の中では、米同士や砥石との摩擦で熱が出ます。回転を急げば米の温度が上がって砕けやすくなるため、熱を逃がしながら低温でゆっくり磨きます。"],note:"<p><b>「精米歩合70％以下の純米酒」という昔の条件は、2004年に撤廃</b>されました。今は80％や90％の純米酒もあります。</p><p>最高峰の磨きの一例が、新澤醸造店の「残響 Super7」。<b>精米歩合7％まで、350時間（約15日）</b>をかけて磨くと公式に紹介されています。数字が小さいほど万能に良いのではなく、狙う味に合わせて削り方を選びます。</p>",options:[{t:"90％",s:"ほとんど削らない。米の味が前に出る",d:{s:0,f:0,k:5},log:"精米歩合90％"},{t:"70％",s:"標準的な線。バランスを取りやすい",d:{s:2,f:1,k:2},log:"精米歩合70％"},{t:"60％",s:"吟醸の領域に入る線。香りと味の両立を狙う",d:{s:3,f:3,k:1},log:"精米歩合60％"},{t:"50％",s:"大吟醸の領域。香りがはっきり立つ",d:{s:4,f:5,k:0},log:"精米歩合50％"},{t:"35％",s:"徹底的に磨く。澄んだ味わいを極める",d:{s:6,f:6,k:-2},log:"精米歩合35％"}]},{id:"shinseki",type:"info",label:"浸漬",eyebrow:"洗い場",art:pe.shinseki,title:"米に水を吸わせます",lede:["磨いた米を水に浸けて、水分を含ませます。よく磨いた米ほど水を吸うのが速く、少量ずつ、ストップウォッチで秒を数えながら引き上げます。これを「限定吸水」といいます。","吸わせすぎれば米が柔らかくなりすぎて溶け崩れ、足りなければ芯が残って溶けきらない。その日の気温、水温、米の乾き具合で、適正な時間は毎回変わります。"],note:"<p>浸漬は「何分固定」ではなく、その日の米と水を読む工程。<b>精米歩合・米の状態・水温で適正時間が変わります。</b></p>",infoLog:"米と水の状態を見て吸水を管理"},{id:"koshiki",label:"蒸し",eyebrow:"甑（こしき）",art:pe.koshiki,title:"米を蒸します",lede:["炊くのではなく、蒸します。甑（こしき）という大きな桶に米を入れ、下から蒸気を通していく。炊いた米では水分が多すぎて、麹菌がうまく育たないからです。","目指す状態には名前があります。「外硬内軟（がいこうないなん）」。外側は硬く、内側は柔らかい。外が硬ければ麹菌をふりかけたときに扱いやすく、中が柔らかければ後の工程できちんと溶けてくれる。"],note:"<p>蒸米の合言葉は「外硬内軟」。<b>炊飯器のご飯のような柔らかさを目指す工程ではありません。</b>外は扱いやすく、内は後で溶けやすくするためです。</p>",options:[{t:"しっかり蒸す",s:"溶けやすい蒸米に。味の出るお酒へ",d:{s:0,f:0,k:4},log:"蒸し：強め"},{t:"狙いどおりに蒸す",s:"外硬内軟。教科書どおりの仕上がり",d:{s:3,f:2,k:2},log:"蒸し：適正"},{t:"硬めに蒸す",s:"溶けにくく、後を引かないお酒へ",d:{s:6,f:0,k:-2},log:"蒸し：硬め"}]},{id:"koji",label:"麹づくり",eyebrow:"麹室（こうじむろ）",art:pe.koji,catArt:Yt.koji,title:"麹をつくります",lede:["蒸した米を麹室（こうじむろ）へ運びます。温度と湿度を管理する部屋です。ここで麹菌をふりかけ、二日かけて育てます。","麹の仕事は、米のデンプンを糖に変えること。酵母は糖しか食べられないので、麹がなければアルコールは一滴も生まれません。夜中も数時間おきに手を入れて温度を調整するため、この二日間は蔵人が眠れない期間です。","「一麹（いちこうじ）、二酛（にもと）、三造り（さんつくり）」。酒づくりで手間のかかる順番を表す言葉ですが、麹が一番目に来ています。"],note:"<p>麹菌はアルコールを作る菌ではありません。<b>デンプンを糖に変える酵素をつくり、その糖を酵母がアルコールにします。</b>二つの微生物の仕事を、ひとつの仕込みでつなぐのです。</p>",options:[{t:"突き破精（つきはぜ）",s:"菌糸を点々と、深く入れる。軽やかで香りの立つお酒に",d:{s:4,f:5,k:0},log:"麹：突き破精"},{t:"総破精（そうはぜ）",s:"全体にまんべんなく回す。味が濃く、飲みごたえのあるお酒に",d:{s:0,f:0,k:5},log:"麹：総破精"},{t:"中間を狙う",s:"どちらにも振りきらない標準的な麹",d:{s:2,f:2,k:2},log:"麹：標準"}]},{id:"shubo",label:"酒母づくり",eyberow:"酛場（もとば）",eyebrow:"酛場（もとば）",art:pe.shubo,title:"酵母を育てる「酛」をつくります",lede:["さきほどの「一麹、二酛、三造り」の、二番目がここです。酛（もと）は酒母（しゅぼ）とも呼ばれ、健康な酵母を大量に増やした種のことをいいます。","問題は、酵母を育てたい場所には雑菌も来るということ。そこで乳酸の力を借ります。乳酸で酸っぱい環境をつくると、雑菌は生きられず、酵母だけが平気で増えていく。この乳酸をどう用意するかで、造り方が分かれます。","仕込みの最初に醸造用乳酸を加えるのか、それとも蔵の環境にいる乳酸菌を取り込み、乳酸ができるのを待つのか。前者は10〜14日ほど、後者は約一ヶ月かかります。"],note:"<p><b>山廃の「廃」は山を捨てる意味ではなく、「山卸（やまおろし）」という作業を廃止した、という意味。</b>生酛と山廃は、どちらも生酛系酒母です。</p><p>山廃では代表的な方法の一つとして、仕込み水に先に麹を入れて酵素を溶かす「水麹」を使うことがあります。ただし、<b>水麹は山廃そのものの定義ではありません。</b></p><p>速醸は、必要な乳酸を最初から加えて雑菌を抑え、酒母を短期間で安定して育てる方法です。<b>「速い＝雑」ではなく、狙う酒質に合わせた合理的な選択</b>です。</p>",options:[{t:"速醸（そくじょう）",s:"醸造用乳酸を加え、10〜14日ほど。短期間で安定した酒母に",d:{s:5,f:3,k:0},log:"酒母：速醸"},{t:"山廃（やまはい）",s:"蔵の乳酸菌を待って一ヶ月。酸と旨みが乗る",d:{s:0,f:0,k:6},log:"酒母：山廃"},{t:"生酛（きもと）",s:"米をすりつぶす昔ながらの手法。もっとも手がかかる",d:{s:1,f:0,k:6},log:"酒母：生酛"}]},{id:"shikomi",label:"仕込み",eyebrow:"仕込み蔵",art:pe.shikomi,title:"三段に分けて仕込みます",lede:["できあがった酛に、麹・蒸米・水を三回に分けて加えていきます。","初日が「添（そえ）」。二日目はあえて何もしない「踊（おどり）」。三日目が「仲（なか）」、四日目が「留（とめ）」。四日かけて、タンクの中身は最初の十数倍にふくらみます。","一度に全部入れないのは、酵母を薄めて弱らせないためです。少しずつ増やして、雑菌に負けない状態を保ち続ける。四日間かけて、酵母に足場を固めさせているわけです。"],note:"<p>二日目の「踊り」は、何もしない無駄な日ではありません。<b>次の仕込みの前に酵母を増やし、もろみを一気に薄めないための間</b>です。</p><p>酒母で酵母を守り、三段仕込みで少しずつ量を増やし、低温で細かく発酵を管理する。<b>この工程の連携こそ、日本で長い時間をかけて磨かれてきた日本酒らしい進化</b>です。</p>",options:[{t:"水を多めに",s:"軽やかで、するすると飲める味わいに",d:{s:6,f:1,k:-2},log:"汲水：多め"},{t:"標準の配合で",s:"蔵の基本形。扱いやすい",d:{s:2,f:2,k:2},log:"汲水：標準"},{t:"水を控えめに",s:"味が濃く、飲みごたえのある味わいに",d:{s:-1,f:1,k:5},log:"汲水：控えめ"}]},{id:"moromi",label:"醪（もろみ）管理",eyebrow:"仕込みタンク",art:pe.moromi,catArt:Yt.moromi,title:"発酵を見守ります",lede:["ここから三週間から一ヶ月。タンクの中では、麹がデンプンを糖に変え、その糖を酵母がアルコールに変えています。","この二つが同じもろみで同時に進むことを「並行複発酵（へいこうふくはっこう）」といいます。ワインは原料にもともとある糖を発酵させ、一般的なビールは糖化を終えてから発酵させます。糖化と発酵を一つのもろみで進める醸造酒は、世界的にも珍しい造り方です。","日本酒だけの方式ではなく、中国の黄酒や韓国のマッコリにも同時に糖化・発酵する例があります。ただし、黄酒は「曲」、マッコリは「ヌルク」という多様な微生物を含むスターターを使います。日本酒は主に黄麹菌を米に育てた米麹を使い、酒母・三段仕込み・低温管理を組み合わせて精密に制御する点が違います。","蔵人がすることは、毎日の温度管理です。数字を見て、少し冷やす、少し温める。それだけを一ヶ月続けます。"],note:"<p>並行複発酵は「日本酒だけ」の秘密ではありません。それでも、世界の多くのワインやビールとは違う、<b>とても珍しい発酵の仲間</b>です。日本酒では、米麹が糖を少しずつ供給し、酵母がそれを次々にアルコールへ変えるため、醸造酒として高い度数まで発酵できます。</p><p>酵母がつくる代表的な香り成分には、リンゴ・洋ナシのような<strong>カプロン酸エチル</strong>と、バナナ・メロンのような<strong>酢酸イソアミル</strong>があります。低温でゆっくり発酵させると、前者が増えやすく、吟醸香が華やかになる理由の一つです。</p>",mini:{h:"酵母早見",lede:"香りの方向は、温度だけでなく「どの酵母を使うか」でも変わります。前の2つは酒造りの歴史を変えた酵母、あとの3つは香りで選ばれる酵母です。",rows:[["6号","秋田・新政で見つかった現存最古。低温でも力強く発酵し、寒い土地の酒造りを変えた酵母。香りは穏やかで、米の旨味が出やすい"],["7号","最も普及した万能型。吟醸から普段の日本酒まで、幅広く使われている"],["14号","バナナ・メロン系の、やわらかな吟醸香（酢酸イソアミル）"],["1501号・1601号","リンゴ・洋ナシ系の、華やかな吟醸香（カプロン酸エチル）"],["1701号・1801号","両方の香りを高める改良型。リンゴ系とバナナ系をバランスよく持つ"]],foot:"番号の末尾の「01」は、発酵中に高い泡が立たない酵母の印です。昔は泡がタンクから溢れないよう、蔵人が夜通し見張る「泡守り（あわもり）」という仕事がありました。それを要らなくしたのが泡なし酵母。地味ですが、蔵の眠れない夜をひとつ減らした発明です。"},options:[{t:"低温で、ゆっくり",s:"10℃前後で一ヶ月。果実のような香りを狙う",d:{s:4,f:7,k:-1},log:"醪：低温長期"},{t:"中温で、標準的に",s:"扱いやすく、失敗の少ない進め方",d:{s:3,f:2,k:3},log:"醪：中温"},{t:"高めの温度で、力強く",s:"しっかり溶かして、味を出す",d:{s:-1,f:0,k:6},log:"醪：高温"}],sub:{eyebrow:"仕込みタンク",title:"どの酵母で仕込みますか",lede:["温度が決まったら、次は酵母です。米のデンプンを糖に変えるのが麹の仕事なら、その糖をアルコールと香りに変えるのが酵母の仕事。","同じ米、同じ温度で仕込んでも、酵母が違えば出てくる香りが変わります。リンゴの方向にも、バナナの方向にも転ぶ。蔵はここを、仕込む前に決めています。"],note:"<p>いま日本でいちばん多く使われているのは<b>7号</b>（長野・真澄から分離）。吟醸から普段の日本酒まで、これ一本で幅広く造れる万能型です。</p><p>迷ったら7号、狙いがあるなら別の酵母を、というのが実際の蔵の考え方に近いかたちです。</p>",options:[{t:"リンゴ・洋ナシの方向へ",s:"1501号・1601号など。カプロン酸エチルという香り成分が多い酵母",d:{s:1,f:7,k:0},log:"酵母：リンゴ・洋ナシ系"},{t:"バナナ・メロンの方向へ",s:"14号など。酢酸イソアミルという香り成分が多い酵母",d:{s:0,f:6,k:1},log:"酵母：バナナ・メロン系"},{t:"香りは控えめに、旨味を出す",s:"6号など。低温でも力強く発酵し、寒い土地の酒造りを変えた酵母。昭和10年から現役",d:{s:0,f:0,k:4},log:"酵母：穏やか・旨味系"}]}},{id:"aruten",label:"アルコール添加",eyebrow:"仕込みタンク",art:pe.shikomi,title:"搾る前に、仕上げ方を選びます",lede:["発酵を終えた醪を搾る、その直前。ここで仕上げ方を決めます。米と米麹だけで通せば「純米」が付き、使えば付きません。精米歩合や発酵の選び方との組み合わせで、吟醸酒・本醸造酒・普通酒などに分かれます。","醸造アルコールそのものには、味も香りもほとんどありません。だから使うと全体が少し軽くなり、そのぶん香りが上に立ちやすくなって、後味がすっと引けます。量を増やすためのものではなく、狙った香りと後味を引き出すための技術です。"],note:"<p>どちらが上等ということはありません。<b>香りを高く立たせたいお酒では、少量の醸造アルコールを使うのが定石</b>で、全国新酒鑑評会に出されるお酒にも多く見られます。江戸時代の「柱焼酎」から続く、四百年ぶんの技術です。</p><p>いっぽう、米と米麹だけで通せば米由来の成分がそのまま残るため、<b>味の重心が下がり、余韻が長く残ります。</b>どちらを選ぶかは、狙う味しだいです。</p>",options:[{t:"米と米麹だけで仕上げる",s:"味の重心が下がり、余韻が長く残る（「純米」と名乗る造り）",d:{s:0,f:0,k:3},log:"仕上げ：米と米麹だけ（純米）"},{t:"醸造アルコールで香味を調える",s:"香りが立ち、後味がすっと引ける仕上がりに",d:{s:3,f:0,k:-2},log:"仕上げ：醸造アルコールで香味を調える"}]},{id:"joso",label:"上槽（じょうそう）",eyebrow:"やぶた",art:pe.joso,title:"醪を搾ります",lede:["発酵が狙いどおりに進んだら、醪を搾って液体と酒粕に分けます。いま多くの蔵で使われているのが「やぶた」と呼ばれる機械です。板と板のあいだに醪を送り込み、空気圧をかけて搾ります。","面白いのは、搾りはじめから終わりまでで、出てくる酒の性格が変わることです。同じタンクの、同じ醪から出てくるのに、時間とともに味が動いていく。"],note:"<p>最初に圧をかけず自然に流れ出るのが「荒走り（あらばしり）」。次に出る澄んだ部分が「中取り（なかどり）」。圧をかけて絞り切る最後が「責め（せめ）」。</p><p><b>「中取り」が少し高くなるのは、一番バランスのよい時間帯だけを分けて瓶詰めするから。</b>同じ醪の全量を使えず、取れる量が限られ、選別と別詰めの手間も増えます。</p><p>さらに希少なのが「袋吊り（雫搾り）」。醪を小さな袋へ詰めて一つずつ吊り、圧をかけずに落ちる雫だけを長時間かけて集めます。<b>人手がかかるうえ、搾り切れず取れる酒も少ないため、鑑評会用や特別な酒など、ごく限られた仕込みで使われます。</b></p>",options:[{t:"荒走りを選ぶ",s:"最初のひと搾り。しゅわっとした微発泡感が残る",d:{s:3,f:4,k:2},log:"荒走り"},{t:"中取りを選ぶ",s:"真ん中の、最も澄んだ部分だけを瓶へ",d:{s:5,f:3,k:1},log:"中取り"},{t:"責めまで含める",s:"最後まで搾りきる。味は濃いが雑味も出る",d:{s:-2,f:0,k:5},log:"責めまで"}]},{id:"shiage",label:"仕上げ",eyebrow:"瓶詰め場",art:pe.shiage,title:"搾った酒を、どう仕上げますか",lede:["搾ったばかりの酒は、うっすら色がつき、粒の細かい成分が漂っています。ここで活性炭を使うと、色が抜けて香味の角が取れ、澄んだ酒になります。使わなければ、その分だけ香味や色をより残す方向になります。","「無濾過」は、「原酒」や「生酒」のように、国税庁の表示基準で製法の要件が決められた言葉ではありません。何をどこまでやったら無濾過と呼ぶかは、蔵ごとに考え方が違います。このゲームでは「活性炭で香味を整えない仕上げ」として扱います。"],note:"<p>活性炭は、色を抜くだけでなく<b>雑味や、狙いから外れた香りも一緒に取り除きます。</b>整った酒になるかわりに、個性はやや穏やかになります。</p><p>活性炭を使わない分、香味や色をより残す方向になります。これは技術の優劣ではなく、狙いの違いです。</p>",options:[{t:"活性炭で整える",s:"色が抜けて澄み、香りの角も取れる",d:{s:5,f:-3,k:-2},log:"濾過：活性炭"},{t:"無濾過で仕上げる",s:"活性炭を使わず、香味や色をより残す",d:{s:-1,f:1,k:2},log:"濾過：無濾過"}],sub:{eyebrow:"瓶詰め場",title:"割水をしますか",lede:["搾ったままの酒は、一般にアルコール度数が17〜20度ほどあります。ここに水を加えて、多くは15〜16度に整えるのが「割水（わりみず）」。多くの日本酒はこの工程を通ります。","ほとんど加えなければ「原酒」。度数が高いぶん味も濃く、口に含んだときの押しが強くなります。少量ずつ、ロックや燗で楽しむ人も多い造りです。"],note:"<p>割水は薄めるための作業ではなく、<b>飲みやすい度数と味の濃さに整えるため</b>の工程です。仕込み水と同じ水を使うのが基本です。</p><p><b>「原酒」は、搾ったあとにほとんど加水調整をしていない酒</b>のこと。表示基準では、加水によるアルコール分の変化が1％未満なら「原酒」と表示できます。度数が高いので、少しずつ味わうか、氷や燗で表情を変えて楽しみます。</p>",options:[{t:"割水して整える",s:"15〜16度へ。穏やかで飲みやすい仕上がり",d:{s:4,f:0,k:-2},log:"割水：する"},{t:"原酒のまま仕上げる",s:"水を加えない。度数が高く、味の押しが強い",d:{s:-1,f:0,k:3},log:"割水：しない（原酒）"}]}},{id:"hiire",label:"火入れ",eyebrow:"貯蔵",art:pe.hiire,title:"火入れ作業をしますか",lede:["搾ったばかりの酒には、酵素も微生物もまだ生きています。そのままだと味がどんどん変わっていくため、60〜65℃で温めて働きを止めます。これが「火入れ」です。","機会は二回あります。貯蔵する前と、瓶に詰める前。どちらでやるか、あるいはやらないかで、四つの選び方が生まれます。","火入れは、酵素や微生物の働きを止めて味を安定させる工程です。ここで安定させたあと、次の貯蔵・熟成で味を整えていきます。"],note:"<p><b>火入れと熟成は、別の仕事です。</b>火入れは酵素や微生物の働きを止め、熟成は時間と温度で香味を整えます。</p><p>ちなみに、日本では16世紀後半には酒を加熱する「火入れ」の記録が残っています。パスツールがワイン保存の加熱法を特許出願したのは1865年。日本の酒造りでは、加熱の科学的な理屈が整理される約300年前から、経験に基づく火入れが行われていたのです。</p>",options:[{t:"生酒（なまざけ）",s:"一度も火を入れない。要冷蔵、鮮度が命",d:{s:4,f:5,k:0},log:"生酒"},{t:"生貯蔵酒",s:"生のまま貯蔵し、瓶詰め前に一回だけ",d:{s:4,f:3,k:1},log:"生貯蔵酒"},{t:"生詰め",s:"貯蔵前に一回。ひやおろしはこの造り",d:{s:2,f:2,k:4},log:"生詰め"},{t:"二回火入れ",s:"定番の方法。味の個性を落ち着かせ、常温で流通できる",d:{s:4,f:1,k:0},log:"二回火入れ"}]},{id:"chozo",label:"貯蔵・熟成",eyebrow:"貯蔵蔵",art:pe.chozo,catArt:Yt.storage,title:"貯蔵はどうしますか",lede:["搾りたての酒は、味が荒く、成分同士がまだなじんでいません。寝かせると角が取れ、甘み・うまみ・濃さがまとまっていきます。ただし、その荒さごと「しぼりたての勢い」として出す造りもあります。どちらも狙いのうちです。","低温ほど変化はゆっくり進みます。氷点下近くで貯蔵すれば香味の変化を小さく抑えながら穏やかに整い、温度と時間をかければ、色や香り、余韻まで大きく変わることがあります。"],note:"<p><b>熟成は、三角チャートの「しっかり」と結びつきやすい工程</b>です。ただし、酒母や原酒かどうかなど、ほかの要素と重なって最終的な味になります。</p><p>ひと夏を越した酒は、荒さや渋みが減り、甘み・うまみ・濃さが増すことがあります。数年単位の長期熟成では、カラメル、干し果物、木の実のような香りが現れることも。一方、<b>－5℃前後の低温では香味成分の変化が小さく、鮮度を守りながら時間をかけて穏やかに整えられます。</b></p>",options:[{t:"すぐに出荷する",s:"寝かせずに新酒として。しぼりたての勢いと香りをそのまま届ける",d:{s:4,f:4,k:0},log:"貯蔵：なし（新酒）"},{t:"低温で貯蔵する",s:"－5℃前後で変化を抑え、鮮度を守りながら穏やかに整える",d:{s:6,f:1,k:1},log:"貯蔵：低温"},{t:"ひと夏、寝かせる",s:"荒さを落ち着かせ、うまみと丸みをのせる",d:{s:2,f:1,k:5},log:"熟成：ひと夏"},{t:"熟成酒にする",s:"数年かけて色も香りも深く変え、複雑で長い余韻を育てる",d:{s:0,f:0,k:7},log:"熟成：長期"}]}],pp=[{n:"〆張鶴",s:75,f:17,k:8,m:"◎",st:!0},{n:"サビ猫ロック",s:62,f:15,k:23,m:"☆",st:!0},{n:"酒場の純大",s:64,f:27,k:9,m:"◎",st:!0},{n:"K",s:7
