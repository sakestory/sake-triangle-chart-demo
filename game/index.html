.sk-root{
  --washi:#F7F4EC;
  --washi-deep:#EDE7DA;
  --sumi:#2B2A26;
  --sumi-soft:#5C594F;
  --ai:#22505F;
  --ai-light:#3E7488;
  --kouji:#B98F2B;
  --tsuchi:#8C5A3C;
  --line:#DAD2C0;
  background:var(--washi);
  color:var(--sumi);
  min-height:100vh;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 52px;
}
.sk-wrap{max-width:640px;margin:0 auto;padding:0 20px;box-sizing:border-box;}
.sk-mincho{font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"MS PMincho",serif;}

.sk-bar{padding:18px 0 12px;}
.sk-bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px;}
.sk-step-no{font-size:12px;letter-spacing:.14em;color:var(--sumi-soft);}
.sk-step-name{font-size:13px;color:var(--ai);font-weight:600;}
.sk-track{height:3px;background:var(--washi-deep);border-radius:2px;overflow:hidden;}
.sk-fill{height:100%;background:var(--ai);transition:width .5s ease;}

.sk-card{
  background:#FFFDF8;
  border:1px solid var(--line);
  border-radius:3px;
  padding:0 0 26px;
  margin-top:18px;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
  overflow:hidden;
}
.sk-inner{padding:0 22px;}
.sk-illust{
  display:block;width:100%;height:auto;
  background:var(--washi-deep);
  border-bottom:1px solid var(--line);
}
.sk-cat-art{
  aspect-ratio:16/9;object-fit:cover;object-position:center;
}
.sk-eyebrow{
  font-size:11px;letter-spacing:.2em;color:var(--kouji);
  margin:22px 0 12px;font-weight:700;
}
.sk-h{
  font-size:25px;line-height:1.5;margin:0 0 16px;font-weight:600;
  letter-spacing:.02em;word-break:break-word;
}
.sk-lede{font-size:15px;line-height:2.05;color:var(--sumi-soft);margin:0 0 15px;word-break:break-word;}
.sk-lede:last-of-type{margin-bottom:0;}

.sk-opts{display:flex;flex-direction:column;gap:11px;margin-top:22px;}
.sk-opt{
  text-align:left;width:100%;box-sizing:border-box;
  background:var(--washi);border:1px solid var(--line);
  border-radius:3px;padding:15px 16px;cursor:pointer;
  font-family:inherit;color:var(--sumi);
  transition:border-color .18s ease, background .18s ease, transform .18s ease;
}
.sk-opt:hover{border-color:var(--ai-light);background:#FFFDF8;}
.sk-opt:focus-visible{outline:2px solid var(--ai);outline-offset:2px;}
.sk-opt:active{transform:translateY(1px);}
.sk-opt-t{display:block;font-size:16px;font-weight:600;line-height:1.6;margin-bottom:4px;word-break:break-word;}
.sk-opt-s{display:block;font-size:13px;line-height:1.8;color:var(--sumi-soft);word-break:break-word;}

.sk-note{
  margin-top:20px;padding:16px 17px;
  background:var(--washi-deep);border-radius:3px;
  font-size:13.5px;line-height:2.05;color:var(--sumi-soft);word-break:break-word;
}
.sk-note-label{display:block;margin:0 0 8px;color:var(--ai);font-size:11px;font-weight:700;letter-spacing:.12em;line-height:1.5;}
.sk-note b{color:var(--ai);font-weight:600;}
.sk-note p{margin:0 0 11px;}
.sk-note p:last-child{margin:0;}

.sk-skip{
  display:block;margin:16px auto 0;background:none;border:none;
  color:var(--sumi-soft);font-size:13px;font-family:inherit;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;
}
.sk-skip:hover{color:var(--ai);}

.sk-next{
  display:block;width:100%;box-sizing:border-box;margin-top:22px;
  background:var(--ai);color:#FFFDF8;border:none;border-radius:3px;
  padding:16px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:background .18s ease;
}
.sk-next:hover{background:var(--ai-light);}
.sk-link-btn{text-decoration:none;text-align:center;}
.sk-share-canvas{
  display:block;width:100%;height:auto;border:1px solid var(--line);
  border-radius:4px;margin-top:6px;box-shadow:0 6px 20px -10px rgba(43,42,38,.3);
}
.sk-share-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.sk-share-btns .sk-next{margin-top:0;font-size:14px;padding:14px 8px;}
.sk-ghost{background:transparent;color:var(--ai);border:1px solid var(--ai);}
.sk-ghost:hover{background:var(--washi-deep);}
.sk-share-hint{font-size:12px;color:var(--sumi-soft);text-align:center;margin:11px 2px 0;line-height:1.8;}
.sk-yomi{font-size:13px;letter-spacing:.22em;color:var(--kouji);margin:6px 0 0;}
.sk-ver{display:inline-block;margin-top:5px;color:var(--kouji);letter-spacing:.04em;}
.sk-sns{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:11px !important;}
.sk-sns a{color:var(--ai);font-weight:600;text-decoration:underline;text-underline-offset:3px;}
@media (max-width:360px){.sk-share-btns{grid-template-columns:1fr;}}
.sk-total{
  font-size:13px;line-height:1.9;color:var(--sumi-soft);
  margin:0 0 14px;display:flex;flex-direction:column;gap:2px;
}
.sk-total strong{color:var(--ai);font-weight:700;}
.sk-total-note{font-size:11.5px;color:#8A8071;}
.sk-next:focus-visible{outline:2px solid var(--kouji);outline-offset:2px;}

.sk-gauge{
  position:relative;height:46px;background:var(--washi-deep);
  border-radius:3px;margin-top:20px;overflow:hidden;
}
.sk-zone{position:absolute;top:0;bottom:0;background:rgba(34,80,95,.16);}
.sk-zone-core{position:absolute;top:0;bottom:0;background:rgba(185,143,43,.3);}
.sk-needle{position:absolute;top:0;bottom:0;width:2px;background:var(--sumi);}
.sk-gauge-cap{font-size:12.5px;color:var(--sumi-soft);margin-top:10px;line-height:1.9;}

.sk-chart{display:block;width:100%;height:auto;margin:6px auto 0;max-width:340px;}
.sk-axis-list{display:flex;flex-direction:column;gap:9px;margin-top:20px;}
.sk-axis-row{display:flex;align-items:center;gap:11px;}
.sk-axis-lb{font-size:13px;width:74px;flex-shrink:0;color:var(--sumi-soft);}
.sk-axis-track{flex:1;height:7px;background:var(--washi-deep);border-radius:4px;overflow:hidden;}
.sk-axis-fill{height:100%;transition:width .6s ease;}
.sk-axis-val{font-size:12px;width:34px;text-align:right;flex-shrink:0;color:var(--sumi-soft);}

.sk-log{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;}
.sk-log-h{font-size:12px;letter-spacing:.16em;color:var(--kouji);font-weight:700;margin:0 0 12px;}
.sk-log-row{display:flex;gap:10px;font-size:13px;line-height:1.9;padding:5px 0;color:var(--sumi-soft);}
.sk-log-k{width:94px;flex-shrink:0;color:var(--sumi);}
.sk-log-v{flex:1;word-break:break-word;}

.sk-brand{
  border:1px solid var(--line);border-radius:3px;
  padding:16px 17px;margin-top:12px;background:var(--washi);
}
.sk-brand-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:7px;}
.sk-brand-rank{
  font-size:11px;letter-spacing:.1em;color:#FFFDF8;background:var(--ai);
  border-radius:2px;padding:3px 7px;flex-shrink:0;font-weight:700;
}
.sk-brand-n{font-size:18px;font-weight:600;line-height:1.5;word-break:break-word;}
.sk-brand-m{font-size:12.5px;color:var(--sumi-soft);word-break:break-word;}
.sk-brand-s{font-size:13.5px;line-height:1.95;color:var(--sumi-soft);margin:0;word-break:break-word;}

.sk-caution{
  margin-top:18px;padding:14px 15px;border-radius:3px;
  border:1px dashed var(--tsuchi);
  font-size:12.5px;line-height:1.95;color:var(--tsuchi);word-break:break-word;
}
.sk-name{
  font-size:29px;line-height:1.5;margin:4px 0 14px;font-weight:600;
  color:var(--ai);word-break:break-word;
}
.sk-foot{
  text-align:center;font-size:12px;color:var(--sumi-soft);
  margin-top:26px;line-height:1.95;
}
.sk-mini{
  margin-top:16px;border:1px solid var(--line);border-radius:3px;
  background:var(--washi);padding:15px 16px 14px;
}
.sk-mini-h{
  font-size:11.5px;letter-spacing:.16em;color:var(--kouji);
  font-weight:700;margin:0 0 4px;
}
.sk-mini-lede{font-size:13px;line-height:1.9;color:var(--sumi-soft);margin:0 0 8px;}
.sk-mini-row{
  display:flex;gap:10px;font-size:13px;line-height:1.85;
  padding:7px 0;border-top:1px solid var(--line);
}
.sk-mini-k{width:88px;flex-shrink:0;color:var(--ai);font-weight:600;word-break:break-word;}
.sk-mini-v{flex:1;color:var(--sumi-soft);word-break:break-word;}
.sk-mini-f{
  font-size:12.5px;line-height:1.9;color:var(--sumi-soft);
  margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line);word-break:break-word;
}
.sk-gacha-card{position:relative;isolation:isolate;}
.sk-gacha-stage{
  position:relative;min-height:460px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:32px 22px;
  overflow:hidden;background:#FFFDF8;
}
.sk-gacha-rays{
  position:absolute;inset:-35%;z-index:-2;opacity:.42;
  background:repeating-conic-gradient(from 0deg,#F8EFD5 0 9deg,#FFFDF8 9deg 18deg);
  animation:sk-rays 12s linear infinite;
}
.sk-gacha-ring{
  position:absolute;width:260px;height:260px;border:1px solid rgba(185,143,43,.55);
  border-radius:50%;z-index:-1;box-shadow:0 0 0 18px rgba(185,143,43,.08),0 0 0 44px rgba(34,80,95,.05);
  animation:sk-ring 1.8s ease-in-out infinite alternate;
}
.sk-gacha-img{
  display:block;width:min(100%,420px);aspect-ratio:16/9;object-fit:cover;
  border:1px solid var(--line);border-radius:4px;background:var(--washi-deep);
  box-shadow:0 14px 34px rgba(43,42,38,.13);transform-origin:50% 65%;
}
.sk-gacha-stage.is-opening .sk-gacha-img{animation:sk-reveal 1.35s cubic-bezier(.2,.78,.24,1) both;}
.sk-gacha-title{font-size:28px;line-height:1.5;margin:22px 0 8px;color:var(--ai);}
.sk-gacha-copy{font-size:14px;line-height:1.9;color:var(--sumi-soft);margin:0;max-width:420px;}
.sk-gacha-stage .sk-next{max-width:420px;}
.sk-gacha-skip{margin-top:10px;}
.sk-brewed-stamp{
  display:inline-block;margin-bottom:10px;padding:5px 11px;border:1px solid var(--kouji);
  color:var(--kouji);font-size:11px;letter-spacing:.18em;font-weight:700;
}
@keyframes sk-rays{to{transform:rotate(360deg)}}
@keyframes sk-ring{to{transform:scale(1.08);opacity:.62}}
@keyframes sk-reveal{
  0%{transform:scale(.72) rotate(-2deg);filter:brightness(.7);opacity:.35}
  55%{transform:scale(1.055) rotate(1deg);filter:brightness(1.16);opacity:1}
  100%{transform:scale(1) rotate(0);filter:brightness(1);opacity:1}
}
@media (max-width:400px){
  .sk-h{font-size:22px;}
  .sk-name{font-size:25px;}
  .sk-inner{padding:0 17px;}
  .sk-mini{padding:14px 13px 13px;}
  .sk-mini-k{width:78px;}
  .sk-gacha-stage{min-height:420px;padding:27px 17px;}
  .sk-gacha-title{font-size:24px;}
}
@media (prefers-reduced-motion:reduce){
  .sk-fill,.sk-axis-fill,.sk-opt{transition:none;}
  .sk-gacha-rays,.sk-gacha-ring,.sk-gacha-stage.is-opening .sk-gacha-img{animation:none;}

i,children:"一本"}),s.jsx("path",{d:"M193 62 H244 L237 98 Q234 109 219 109 T201 98Z",fill:c.wh,stroke:c.ai,strokeWidth:"2"}),s.jsx("path",{d:"M197 81 H240 L237 97 Q234 107 219 107 T201 97Z",fill:c.ail,opacity:".35"}),s.jsx("path",{d:"M218 109 V124 M203 128 H234",stroke:c.ai,strokeWidth:"2"}),s.jsx("path",{d:"M55 124 H275",stroke:c.ai,strokeWidth:"1.7",opacity:".35"}),s.jsx("circle",{cx:"64",cy:"73",r:"3",fill:c.ko}),s.jsx("circle",{cx:"256",cy:"75",r:"3",fill:c.ko})]})},Le=[{id:"rice",label:"米づくり",eyebrow:"田んぼ",art:ve.rice,catArt:Qt.rice,optional:!0,title:"どんな米を育てますか",lede:["酒になる米は、ふだん食べる米とは別のものです。粒が大きく、中心に「心白（しんぱく）」と呼ばれる白く濁った芯を持つものが向いています。","心白の正体は、デンプンの粒がすき間だらけに並んだ部分です。ここに麹菌が菌糸を伸ばしていく。だから酒米は「食べておいしいか」ではなく「溶けやすいか」で選ばれてきました。実際、酒米をそのまま炊いて食べても、あまりおいしくありません。"],note:"<p>酒米は「食べておいしい米」よりも、<b>麹を育てやすく、醪で溶けやすい米</b>として選ばれます。大粒で心白を持つものが多いのは、そのためです。</p><p>酒米は食用米と同じ「米」でも、得意な仕事が違います。</p>",options:[{t:"山田錦",s:"よく溶けて、味に厚みが出る",d:{s:0,f:2,k:3},log:"山田錦"},{t:"五百万石",s:"溶けにくく、飲んだあとが軽くなる",d:{s:4,f:1,k:0},log:"五百万石"},{t:"雄町",s:"よく溶けて、味の幅が大きく出る。個性が強い",d:{s:0,f:1,k:5},log:"雄町"}]},{id:"seimai",label:"精米",eyebrow:"精米所",art:ve.seimai,catArt:Qt.seimai,title:"米をどこまで磨きますか",lede:["米の外側には、たんぱく質や脂質が多く含まれます。これらは酒になると雑味のもとになり、香りの立ち方も鈍らせます。だから外側を削り落とします。削ったあとに残った割合が「精米歩合」です。","50％なら、半分を削って半分だけを使うということ。精米機の中では、米同士や砥石との摩擦で熱が出ます。回転を急げば米の温度が上がって砕けやすくなるため、熱を逃がしながら低温でゆっくり磨きます。"],note:"<p><b>「精米歩合70％以下の純米酒」という昔の条件は、2004年に撤廃</b>されました。今は80％や90％の純米酒もあります。</p><p>最高峰の磨きの一例が、新澤醸造店の「残響 Super7」。<b>精米歩合7％まで、350時間（約15日）</b>をかけて磨くと公式に紹介されています。数字が小さいほど万能に良いのではなく、狙う味に合わせて削り方を選びます。</p>",options:[{t:"90％",s:"ほとんど削らない。米の味が前に出る",d:{s:0,f:0,k:6},log:"精米歩合90％"},{t:"70％",s:"標準的な線。バランスを取りやすい",d:{s:2,f:1,k:2},log:"精米歩合70％"},{t:"50％",s:"大吟醸の領域。香りがはっきり立つ",d:{s:4,f:5,k:0},log:"精米歩合50％"},{t:"35％",s:"徹底的に磨く。澄んだ味わいを極める",d:{s:6,f:6,k:-2},log:"精米歩合35％"}]},{id:"shinseki",type:"info",label:"浸漬",eyebrow:"洗い場",art:ve.shinseki,title:"米に水を吸わせます",lede:["磨いた米を水に浸けて、水分を含ませます。よく磨いた米ほど水を吸うのが速く、少量ずつ、ストップウォッチで秒を数えながら引き上げます。これを「限定吸水」といいます。","吸わせすぎれば米が柔らかくなりすぎて溶け崩れ、足りなければ芯が残って溶けきらない。その日の気温、水温、米の乾き具合で、適正な時間は毎回変わります。"],note:"<p>浸漬は「何分固定」ではなく、その日の米と水を読む工程。<b>精米歩合・米の状態・水温で適正時間が変わります。</b></p>",infoLog:"米と水の状態を見て吸水を管理"},{id:"koshiki",label:"蒸し",eyebrow:"甑（こしき）",art:ve.koshiki,title:"米を蒸します",lede:["炊くのではなく、蒸します。甑（こしき）という大きな桶に米を入れ、下から蒸気を通していく。炊いた米では水分が多すぎて、麹菌がうまく育たないからです。","目指す状態には名前があります。「外硬内軟（がいこうないなん）」。外側は硬く、内側は柔らかい。外が硬ければ麹菌をふりかけたときに扱いやすく、中が柔らかければ後の工程できちんと溶けてくれる。"],note:"<p>蒸米の合言葉は「外硬内軟」。<b>炊飯器のご飯のような柔らかさを目指す工程ではありません。</b>外は扱いやすく、内は後で溶けやすくするためです。</p>",options:[{t:"しっかり蒸す",s:"溶けやすい蒸米に。味の出る酒へ",d:{s:0,f:0,k:5},log:"蒸し：強め"},{t:"狙いどおりに蒸す",s:"外硬内軟。教科書どおりの仕上がり",d:{s:3,f:2,k:2},log:"蒸し：適正"},{t:"硬めに蒸す",s:"溶けにくく、後を引かない酒へ",d:{s:5,f:1,k:-1},log:"蒸し：硬め"}]},{id:"koji",label:"麹づくり",eyebrow:"麹室（こうじむろ）",art:ve.koji,catArt:Qt.koji,title:"麹をつくります",lede:["蒸した米を麹室（こうじむろ）へ運びます。温度と湿度を管理する部屋です。ここで麹菌をふりかけ、二日かけて育てます。","麹の仕事は、米のデンプンを糖に変えること。酵母は糖しか食べられないので、麹がなければアルコールは一滴も生まれません。夜中も数時間おきに手を入れて温度を調整するため、この二日間は蔵人が眠れない期間です。","「一麹（いちこうじ）、二酛（にもと）、三造り（さんつくり）」。酒づくりで手間のかかる順番を表す言葉ですが、麹が一番目に来ています。"],note:"<p>麹菌はアルコールを作る菌ではありません。<b>デンプンを糖に変える酵素をつくり、その糖を酵母がアルコールにします。</b>二つの微生物の仕事を、ひとつの仕込みでつなぐのです。</p>",options:[{t:"突き破精（つきはぜ）",s:"菌糸を点々と、深く入れる。軽やかで香りの立つ酒に",d:{s:4,f:5,k:0},log:"麹：突き破精"},{t:"総破精（そうはぜ）",s:"全体にまんべんなく回す。味が濃く、飲みごたえのある酒に",d:{s:0,f:0,k:6},log:"麹：総破精"},{t:"中間を狙う",s:"どちらにも振りきらない標準的な麹",d:{s:2,f:2,k:2},log:"麹：標準"}]},{id:"shubo",label:"酒母づくり",eyberow:"酛場（もとば）",eyebrow:"酛場（もとば）",art:ve.shubo,title:"酵母を育てる「酛」をつくります",lede:["さきほどの「一麹、二酛、三造り」の、二番目がここです。酛（もと）は酒母（しゅぼ）とも呼ばれ、健康な酵母を大量に増やした種のことをいいます。","問題は、酵母を育てたい場所には雑菌も来るということ。そこで乳酸の力を借ります。乳酸で酸っぱい環境をつくると、雑菌は生きられず、酵母だけが平気で増えていく。この乳酸をどう用意するかで、造り方が分かれます。","仕込みの最初に醸造用乳酸を加えるのか、それとも蔵の環境にいる乳酸菌を取り込み、乳酸ができるのを待つのか。前者は10〜14日ほど、後者は約一ヶ月かかります。"],note:"<p><b>山廃の「廃」は山を捨てる意味ではなく、「山卸（やまおろし）」という作業を廃止した、という意味。</b>生酛と山廃は、どちらも生酛系酒母です。</p><p>山廃では代表的な方法の一つとして、仕込み水に先に麹を入れて酵素を溶かす「水麹」を使うことがあります。ただし、<b>水麹は山廃そのものの定義ではありません。</b></p><p>速醸は、必要な乳酸を最初から加えて雑菌を抑え、酒母を短期間で安定して育てる方法です。<b>「速い＝雑」ではなく、狙う酒質に合わせた合理的な選択</b>です。</p>",options:[{t:"速醸（そくじょう）",s:"醸造用乳酸を加え、10〜14日ほど。短期間で安定した酒母に",d:{s:5,f:4,k:0},log:"酒母：速醸"},{t:"山廃（やまはい）",s:"蔵の乳酸菌を待って一ヶ月。酸と旨みが乗る",d:{s:0,f:0,k:7},log:"酒母：山廃"},{t:"生酛（きもと）",s:"米をすりつぶす昔ながらの手法。もっとも手がかかる",d:{s:1,f:0,k:8},log:"酒母：生酛"}]},{id:"shikomi",label:"仕込み",eyebrow:"仕込み蔵",art:ve.shikomi,title:"三段に分けて仕込みます",lede:["できあがった酛に、麹・蒸米・水を三回に分けて加えていきます。","初日が「添（そえ）」。二日目はあえて何もしない「踊（おどり）」。三日目が「仲（なか）」、四日目が「留（とめ）」。四日かけて、タンクの中身は最初の十数倍にふくらみます。","一度に全部入れないのは、酵母を薄めて弱らせないためです。少しずつ増やして、雑菌に負けない状態を保ち続ける。四日間かけて、酵母に足場を固めさせているわけです。"],note:"<p>二日目の「踊り」は、何もしない無駄な日ではありません。<b>次の仕込みの前に酵母を増やし、もろみを一気に薄めないための間</b>です。</p><p>酒母で酵母を守り、三段仕込みで少しずつ量を増やし、低温で細かく発酵を管理する。<b>この工程の連携こそ、日本で長い時間をかけて磨かれてきた日本酒らしい進化</b>です。</p>",options:[{t:"水を多めに",s:"軽やかで、するすると飲める方向へ",d:{s:5,f:2,k:-1},log:"汲水：多め"},{t:"標準の配合で",s:"蔵の基本形。扱いやすい",d:{s:2,f:2,k:2},log:"汲水：標準"},{t:"水を控えめに",s:"味が濃く、飲みごたえのある方向へ",d:{s:-1,f:1,k:6},log:"汲水：控えめ"}]},{id:"moromi",label:"醪（もろみ）管理",eyebrow:"仕込みタンク",art:ve.moromi,catArt:Qt.moromi,title:"発酵を見守ります",lede:["ここから三週間から一ヶ月。タンクの中では、麹がデンプンを糖に変え、その糖を酵母がアルコールに変えています。","この二つが同じもろみで同時に進むことを「並行複発酵（へいこうふくはっこう）」といいます。ワインは原料にもともとある糖を発酵させ、一般的なビールは糖化を終えてから発酵させます。糖化と発酵を一つのもろみで進める醸造酒は、世界的にも珍しい造り方です。","日本酒だけの方式ではなく、中国の黄酒や韓国のマッコリにも同時に糖化・発酵する例があります。ただし、黄酒は「曲」、マッコリは「ヌルク」という多様な微生物を含むスターターを使います。日本酒は主に黄麹菌を米に育てた米麹を使い、酒母・三段仕込み・低温管理を組み合わせて精密に制御する点が違います。","蔵人がすることは、毎日の温度管理です。数字を見て、少し冷やす、少し温める。それだけを一ヶ月続けます。"],note:"<p>並行複発酵は「日本酒だけ」の秘密ではありません。それでも、世界の多くのワインやビールとは違う、<b>とても珍しい発酵の仲間</b>です。日本酒では、米麹が糖を少しずつ供給し、酵母がそれを次々にアルコールへ変えるため、醸造酒として高い度数まで発酵できます。</p><p>酵母がつくる代表的な香り成分には、リンゴ・洋ナシのような<strong>カプロン酸エチル</strong>と、バナナ・メロンのような<strong>酢酸イソアミル</strong>があります。低温でゆっくり発酵させると、前者が増えやすく、吟醸香が華やかになる理由の一つです。</p>",mini:{h:"酵母早見",lede:"香りの方向は、温度だけでなく「どの酵母を使うか」でも変わります。蔵が仕込み前に選んでいる、代表的な顔ぶれです。",rows:[["6号","香りは穏やかで、米の旨味が前に出る方向へ"],["7号","いまいちばん多く使われている万能型。吟醸から普段の酒まで"],["14号","バナナ・メロンの方向（酢酸イソアミル）"],["1501号・1601号","リンゴ・洋ナシの方向（カプロン酸エチル）"],["1701号・1801号","リンゴ系とバナナ系、両方をバランスよく"]],foot:"番号の末尾の「01」は、発酵中に高い泡が立たない酵母の印です。昔は泡がタンクから溢れないよう、蔵人が夜通し見張る「泡守り（あわもり）」という仕事がありました。それを要らなくしたのが泡なし酵母。地味ですが、蔵の眠れない夜をひとつ減らした発明です。"},options:[{t:"低温で、ゆっくり",s:"10℃前後で一ヶ月。果実のような香りを狙う",d:{s:4,f:7,k:-1},log:"醪：低温長期"},{t:"中温で、標準的に",s:"扱いやすく、失敗の少ない進め方",d:{s:3,f:2,k:3},log:"醪：中温"},{t:"高めの温度で、力強く",s:"しっかり溶かして、味を出す",d:{s:-1,f:0,k:7},log:"醪：高温"}]},{id:"joso",label:"上槽（じょうそう）",eyebrow:"やぶた",art:ve.joso,title:"醪を搾ります",lede:["発酵が狙いどおりに進んだら、醪を搾って液体と酒粕に分けます。いま多くの蔵で使われているのが「やぶた」と呼ばれる機械です。板と板のあいだに醪を送り込み、空気圧をかけて搾ります。","面白いのは、搾りはじめから終わりまでで、出てくる酒の性格が変わることです。同じタンクの、同じ醪から出てくるのに、時間とともに味が動いていく。"],note:"<p>最初に圧をかけず自然に流れ出るのが「荒走り（あらばしり）」。次に出る澄んだ部分が「中取り（なかどり）」。圧をかけて絞り切る最後が「責め（せめ）」。</p><p><b>「中取り」が少し高くなるのは、一番バランスのよい時間帯だけを分けて瓶詰めするから。</b>同じ醪の全量を使えず、取れる量が限られ、選別と別詰めの手間も増えます。</p><p>さらに希少なのが「袋吊り（雫搾り）」。醪を小さな袋へ詰めて一つずつ吊り、圧をかけずに落ちる雫だけを長時間かけて集めます。<b>人手がかかるうえ、搾り切れず取れる酒も少ないため、鑑評会用や特別な酒など、ごく限られた仕込みで使われます。</b></p>",options:[{t:"荒走りを選ぶ",s:"最初のひと搾り。しゅわっとした微発泡感が残る",d:{s:3,f:4,k:2},log:"荒走り"},{t:"中取りを選ぶ",s:"真ん中の、最も澄んだ部分だけを瓶へ",d:{s:5,f:4,k:1},log:"中取り"},{t:"責めまで含める",s:"最後まで搾りきる。味は濃いが雑味も出る",d:{s:-2,f:0,k:6},log:"責めまで"}]},{id:"hiire",label:"火入れ",eyebrow:"貯蔵",art:ve.hiire,title:"火入れ作業をしますか",lede:["搾ったばかりの酒には、酵素も微生物もまだ生きています。そのままだと味がどんどん変わっていくため、60〜65℃で温めて働きを止めます。これが「火入れ」です。","機会は二回あります。貯蔵する前と、瓶に詰める前。どちらでやるか、あるいはやらないかで、四つの選び方が生まれます。","火入れは、酵素や微生物の働きを止めて味を安定させる工程です。ここで安定させたあと、次の貯蔵・熟成で味を整えていきます。"],note:"<p><b>火入れと熟成は、別の仕事です。</b>火入れは酵素や微生物の働きを止め、熟成は時間と温度で香味を整えます。</p><p>ちなみに、日本では16世紀後半には酒を加熱する「火入れ」の記録が残っています。パスツールがワイン保存の加熱法を特許出願したのは1865年。日本の酒造りでは、加熱の科学的な理屈が整理される約300年前から、経験に基づく火入れが行われていたのです。</p>",options:[{t:"生酒（なまざけ）",s:"一度も火を入れない。要冷蔵、鮮度が命",d:{s:4,f:5,k:0},log:"生酒"},{t:"生貯蔵酒",s:"生のまま貯蔵し、瓶詰め前に一回だけ",d:{s:4,f:3,k:1},log:"生貯蔵酒"},{t:"生詰め",s:"貯蔵前に一回。ひやおろしはこの造り",d:{s:2,f:2,k:4},log:"生詰め"},{t:"二回火入れ",s:"定番の方法。常温で流通でき、長くもつ",d:{s:3,f:1,k:4},log:"二回火入れ"}]},{id:"chozo",label:"貯蔵・熟成",eyebrow:"貯蔵蔵",art:ve.label,catArt:Qt.storage,title:"どのように寝かせますか",lede:["搾りたての酒は、味が荒く、成分同士がまだなじんでいません。貯蔵すると角が取れ、甘み・うまみ・濃さがまとまっていきます。どの温度で、どれくらい寝かせるかも、酒質設計の一部です。","低温ほど変化はゆっくり進みます。氷点下近くで貯蔵すれば香味の変化を小さく抑えながら穏やかに整い、温度と時間をかければ、色や香り、余韻まで大きく変わることがあります。"],note:"<p><b>熟成は、三角チャートの「しっかり」と結びつきやすい工程</b>です。ただし、酒母や原酒かどうかなど、ほかの要素と重なって最終的な味になります。</p><p>ひと夏を越した酒は、荒さや渋みが減り、甘み・うまみ・濃さが増すことがあります。数年単位の長期熟成では、カラメル、干し果物、木の実のような香りが現れることも。一方、<b>－5℃前後の低温では香味成分の変化が小さく、鮮度を守りながら時間をかけて穏やかに整えられます。</b></p>",options:[{t:"氷点下近くで、ゆっくり",s:"－5℃前後で変化を抑え、鮮度を守りながら穏やかに整える",d:{s:5,f:3,k:1},log:"貯蔵：氷温・低温"},{t:"ひと夏、寝かせる",s:"荒さを落ち着かせ、うまみと丸みをのせる",d:{s:2,f:1,k:6},log:"熟成：ひと夏"},{t:"数年かけて長期熟成",s:"色も香りも深く変え、複雑で長い余韻を育てる",d:{s:0,f:0,k:9},log:"熟成：長期"}]}],Kd=[{n:"獺祭 純米大吟醸45",b:"旭酒造",p:"山口",s:30,f:55,k:15,m:"洋梨のような香り。日本酒を初めて飲む人にすすめやすい一本"},{n:"十四代 本丸",b:"高木酒造",p:"山形",s:25,f:50,k:25,m:"甘みと香りがまっすぐ前に出る。人気の理由が飲めば分かる"},{n:"田酒 特別純米",b:"西田酒造店",p:"青森",s:30,f:15,k:55,m:"米の旨みが太く、飲みごたえがある。食事と合わせて生きる"},{n:"而今 純米吟醸",b:"木屋正酒造",p:"三重",s:25,f:45,k:30,m:"香りと厚みが両立している。バランスの見本のような酒"},{n:"新政 No.6",b:"新政酒造",p:"秋田",s:40,f:45,k:15,m:"生酒ならではの瑞々しさ。酸が効いて飲んだあとが軽い"},{n:"作 恵乃智",b:"清水清三郎商店",p:"三重",s:35,f:45,k:20,m:"きれいで華やか。冷やしてワイングラスで"},{n:"菊姫 山廃仕込純米",b:"菊姫",p:"石川",s:10,f:10,k:80,m:"酸と旨みが濃い。燗をつけると本領を発揮する"},{n:"浦霞 禅 純米吟醸",b:"佐浦",p:"宮城",s:45,f:30,k:25,m:"おだやかで主張しすぎない。料理の邪魔をしない食中酒の王道"},{n:"八海山 特別本醸造",b:"八海醸造",p:"新潟",s:65,f:15,k:20,m:"淡麗辛口の代表格。するすると飲めて、飲み疲れしない"},{n:"澤屋まつもと 守破離",b:"松本酒造",p:"京都",s:45,f:35,k:20,m:"軽やかで酸がきれい。冷やしてどうぞ"},{n:"睡龍 生酛純米",b:"久保本家酒造",p:"奈良",s:15,f:10,k:75,m:"熟成した旨みと酸。燗にすると化ける"},{n:"鍋島 特別純米",b:"富久千代酒造",p:"佐賀",s:30,f:40,k:30,m:"香りと旨みの重なりが良い。万人に届く味"},{n:"醸し人九平次 純米大吟醸",b:"萬乗醸造",p:"愛知",s:35,f:45,k:20,m:"白ワインのような酸と香り。洋食にも合う"},{n:"天狗舞 山廃仕込純米酒",b:"車多酒造",p:"石川",s:10,f:15,k:75,m:"黄金色の濃い旨み。山廃の分かりやすい入口"},{n:"紀土 純米吟醸",b:"平和酒造",p:"和歌山",s:45,f:35,k:20,m:"やわらかく穏やか。価格も含めて日常に置きやすい"}];function Yd(e,t=3){const n=Math.max(e.s+e.f+e.k,1),r={s:Math.max(e.s,0)/n*100,f:Math.max(e.f,0)/n*100,k:Math.max(e.k,0)/n*100};return[...Kd].map(l=>({...l,d:Math.hypot(l.s-r.s,l.f-r.f,l.k-r.k)})).sort((l,i)=>l.d-i.d).slice(0,t)}const hc={s:[{name:"清凪",yomi:"きよなぎ"},{name:"水冴",yomi:"みずさえ"},{name:"水面",yomi:"みなも"},{name:"涼風",yomi:"りょうふう"}],f:[{name:"花明かり",yomi:"はなあかり"},{name:"花実雫",yomi:"はなみしずく"},{name:"実香月",yomi:"みかづき"},{name:"果乃音",yomi:"かのね"}],k:[{nam
